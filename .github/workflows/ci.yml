name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # This name is the required status check in .github/rulesets/main.json. Keep them in sync.
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MofidEasySdk.slnx

      - name: Build
        run: dotnet build MofidEasySdk.slnx --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test MofidEasySdk.slnx --no-build --configuration Release

      - name: Pack
        run: dotnet pack src/MofidEasySdk --no-build --configuration Release --output artifacts
